name: Build Move Quest Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "move-quest-simple-v4.html"
      - "MoveQuest-Android-NativeShare-v0.2.zip"
      - ".github/workflows/build-move-quest-android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 9.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.1.0"

      - name: Prepare Android project
        shell: bash
        run: |
          set -e
          rm -rf MoveQuest-Android
