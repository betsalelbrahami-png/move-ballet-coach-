name: Build Move Quest Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "MoveQuest-Android-NativeShare-v0.3.zip"
      - ".github/workflows/build-move-quest-android.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 9.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.1.0"

      - name: Unpack Android app
        run: unzip -q MoveQuest-Android-NativeShare-v0.3.zip -d build

      - name: Build APK
        working-directory: build/MoveQuest-Android-v0.3
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MoveQuest-Android-APK
          path: build/MoveQuest-Android-v0.3/app/build/outputs/apk/debug/app-debug.apk
