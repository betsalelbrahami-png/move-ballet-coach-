name: Inspect LookMe Fashion Model

on:
  push:
    branches: [lookme-android-v1]
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect FASHN Space API
        run: |
          python -m pip install --quiet gradio_client
          python - <<'PY'
          from gradio_client import Client
          c=Client('merve/fashn-vton-1.5', verbose=False)
          print(c.view_api(print_info=False, return_format='dict'))
          PY
