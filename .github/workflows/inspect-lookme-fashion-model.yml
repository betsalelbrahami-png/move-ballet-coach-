name: Inspect LookMe Fashion Model

on:
  push:
    branches: [lookme-android-v1]
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download ONNX model
        run: |
          curl -L --fail 'https://huggingface.co/HasanKabir23/Yolov26s-DeepFashion2/resolve/main/best.onnx?download=true' -o best.onnx
          ls -lh best.onnx
          sha256sum best.onnx
      - name: Inspect ONNX graph and run zero input
        run: |
          python -m pip install --quiet onnx onnxruntime numpy
          python - <<'PY'
          import onnx, onnxruntime as ort, numpy as np
          m=onnx.load('best.onnx')
          print('IR',m.ir_version,'opsets',[(x.domain,x.version) for x in m.opset_import])
          sess=ort.InferenceSession('best.onnx', providers=['CPUExecutionProvider'])
          print('inputs')
          for x in sess.get_inputs(): print(x.name,x.type,x.shape)
          print('outputs')
          for x in sess.get_outputs(): print(x.name,x.type,x.shape)
          inp=sess.get_inputs()[0]
          shape=[1 if isinstance(d,str) or d is None else int(d) for d in inp.shape]
          # force expected square input if dynamic
          if len(shape)==4:
            shape[0]=1
            shape[1]=3
            if shape[2] in (0,1): shape[2]=416
            if shape[3] in (0,1): shape[3]=416
          arr=np.zeros(shape,dtype=np.float32)
          out=sess.run(None,{inp.name:arr})
          for i,o in enumerate(out):
            print('runtime output',i,'shape',o.shape,'dtype',o.dtype,'min',float(o.min()),'max',float(o.max()))
          PY
