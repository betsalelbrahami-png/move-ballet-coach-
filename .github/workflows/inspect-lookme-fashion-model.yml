name: Inspect LookMe Fashion Model

on:
  push:
    branches: [lookme-android-v1]
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download current LookMe source
        run: |
          set -euo pipefail
          curl -fsSL 'https://lbmgmfpvxggxoboxfsib.supabase.co/functions/v1/lookme-build-source' -o /tmp/lookme.zip
          unzip -t /tmp/lookme.zip
      - name: Upload current LookMe source
        uses: actions/upload-artifact@v4
        with:
          name: LookMe-V0.6-Source
          path: /tmp/lookme.zip
          if-no-files-found: error
