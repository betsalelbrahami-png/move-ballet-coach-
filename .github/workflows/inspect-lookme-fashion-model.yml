name: Inspect LookMe Fashion Model

on:
  push:
    branches: [lookme-android-v1]
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect current LookMe source
        run: |
          set -euo pipefail
          curl -fsSL 'https://lbmgmfpvxggxoboxfsib.supabase.co/functions/v1/lookme-build-source' -o /tmp/lookme.zip
          rm -rf /tmp/lookme && mkdir -p /tmp/lookme
          unzip -q /tmp/lookme.zip -d /tmp/lookme
          echo '--- ai.ts ---'
          cat /tmp/lookme/src/services/ai.ts
          echo '--- App try-on block ---'
          sed -n '300,345p' /tmp/lookme/App.tsx
          echo '--- auth block ---'
          sed -n '35,115p' /tmp/lookme/App.tsx
      - name: Smoke test FASHN Space API
        run: |
          python -m pip install --quiet gradio_client
          python - <<'PY'
          from gradio_client import Client, handle_file
          c=Client('merve/fashn-vton-1.5', verbose=False)
          person='https://huggingface.co/spaces/merve/fashn-vton-1.5/resolve/main/assets/examples/person3.png'
          garment='https://huggingface.co/spaces/merve/fashn-vton-1.5/resolve/main/assets/examples/garment3.jpeg'
          r=c.predict(handle_file(person), handle_file(garment), 'tops', 'flat-lay', 10, 1.5, 42, True, api_name='/try_on')
          print('RESULT',r)
          PY
