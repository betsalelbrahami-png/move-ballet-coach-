name: Build Voix Live APK
on:
  push:
    branches: [main]
    paths:
      - 'voix-live-android/**'
      - '.github/workflows/build-voix-live-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle -p voix-live-android :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Voix-Live-Android-v0.1
          path: voix-live-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
