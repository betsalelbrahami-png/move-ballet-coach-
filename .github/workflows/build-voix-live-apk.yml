name: Build Voix Live Local APK

on:
  push:
    branches: [main]
    paths:
      - 'voix-live-android/**'
      - '.github/workflows/build-voix-live-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache Hugging Face checkpoint
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: voix-live-iter-model-v1

      - name: Export and verify local ONNX model
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.7.1
          pip install onnx==1.18.0 onnxruntime==1.22.0 hydra-core==1.3.2 'huggingface-hub<1.0'
          python voix-live-android/tools/export_iter_model.py \
            --output voix-live-android/app/src/main/assets/iter_model_4s_10s.onnx

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      - name: Install Android SDK 35
        run: |
          SDKMANAGER_PATH="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          "$SDKMANAGER_PATH" 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Android APK
        run: gradle -p voix-live-android :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Verify packaged model
        run: |
          unzip -l voix-live-android/app/build/outputs/apk/debug/app-debug.apk | grep iter_model_4s_10s.onnx
          ls -lh voix-live-android/app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Voix-Live-Android-v1.2-stable
          path: voix-live-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          compression-level: 0
