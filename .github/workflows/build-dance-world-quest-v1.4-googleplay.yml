name: Build Dance World Quest v1.4 Google Play AAB

on:
  push:
    branches:
      - main
    paths:
      - DanceWorldQuest-Android-v1.4-source.zip
      - .github/workflows/build-dance-world-quest-v1.4-googleplay.yml
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 9.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.1.0"

      - name: Unpack v1.4 Android source
        shell: bash
        run: |
          rm -rf build-v14
          mkdir -p build-v14
          unzip -q DanceWorldQuest-Android-v1.4-source.zip -d build-v14
          project_dir="build-v14/DanceWorldQuest-Android-v1.3.4"
          grep -Eq 'versionCode[[:space:]]+17' "$project_dir/app/build.gradle"
          grep -Eq 'versionName[[:space:]]+"1\.4"' "$project_dir/app/build.gradle"
          grep -Eq 'targetSdk[[:space:]]+36' "$project_dir/app/build.gradle"

      - name: Prepare private upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.DWQ_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.DWQ_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DWQ_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.DWQ_UPLOAD_KEY_PASSWORD }}
        shell: bash
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "Missing DWQ_UPLOAD_KEYSTORE_BASE64" && exit 1)
          test -n "$STORE_PASSWORD" || (echo "Missing DWQ_UPLOAD_STORE_PASSWORD" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing DWQ_UPLOAD_KEY_ALIAS" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing DWQ_UPLOAD_KEY_PASSWORD" && exit 1)
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/dwq-upload.jks"

      - name: Build release AAB
        working-directory: build-v14/DanceWorldQuest-Android-v1.3.4
        run: gradle --no-daemon :app:bundleRelease

      - name: Sign AAB with Google Play upload key
        env:
          STORE_PASSWORD: ${{ secrets.DWQ_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DWQ_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.DWQ_UPLOAD_KEY_PASSWORD }}
        shell: bash
        run: |
          AAB="build-v14/DanceWorldQuest-Android-v1.3.4/app/build/outputs/bundle/release/app-release.aab"
          jarsigner -keystore "$RUNNER_TEMP/dwq-upload.jks" -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" "$AAB" "$KEY_ALIAS"
          jarsigner -verify -verbose -certs "$AAB" >/dev/null

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: DanceWorldQuest-v1.4-GooglePlay-AAB
          path: build-v14/DanceWorldQuest-Android-v1.3.4/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
