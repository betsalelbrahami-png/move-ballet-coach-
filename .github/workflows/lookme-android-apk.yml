name: Build LookMe Complete Android APK

on:
  push:
    branches: [lookme-v1-complete]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore LookMe source and apply complete V1 patches
        run: |
          set -euo pipefail
          rm -rf lookme
          mkdir -p lookme
          curl -fsSL 'https://lbmgmfpvxggxoboxfsib.supabase.co/functions/v1/lookme-build-source' -o /tmp/lookme.zip
          unzip -t /tmp/lookme.zip
          unzip -q /tmp/lookme.zip -d lookme

          sed -e 's|/tmp/v06orig/|lookme/|g' -e 's|/tmp/v07/|lookme/|g' lookme-v07.patch > /tmp/lookme-v07.patch
          patch -p0 < /tmp/lookme-v07.patch
          sed -i "s/FileSystem.getInfoAsync(MODEL_PATH, { size:true })/FileSystem.getInfoAsync(MODEL_PATH)/" lookme/src/services/localVision.ts
          sed -i "s/FileSystem.getInfoAsync(MODEL_TMP, { size:true })/FileSystem.getInfoAsync(MODEL_TMP)/" lookme/src/services/localVision.ts

          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('lookme/App.tsx')
          s=p.read_text()
          old="""          const info = await MediaLibrary.getAssetInfoAsync(asset);\n          const localUri = info.localUri || asset.uri;"""
          new="""          const localUri = asset.uri;"""
          if old not in s:
              raise SystemExit('Expected v0.8 media block not found')
          s=s.replace(old,new)
          s=s.replace('asset.width || info.width || 1000, asset.height || info.height || 1000', 'asset.width || 1000, asset.height || 1000')
          s=s.replace('Android V1 • 0.7','Android V1 • 0.8')
          p.write_text(s)
          app=Path('lookme/app.json')
          data=json.loads(app.read_text())
          data['expo']['version']='0.8.0'
          data['expo']['android']['versionCode']=8
          app.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          PY

          sed -e 's|/mnt/data/lookme_v08_pristine/|lookme/|g' -e 's|/mnt/data/lookme_v08_src/|lookme/|g' lookme-v09.patch > /tmp/lookme-v09.patch
          patch -p0 < /tmp/lookme-v09.patch

          cat lookme-v1-complete.patch.b64.part* > /tmp/lookme-v1-complete.patch.b64
          base64 -d /tmp/lookme-v1-complete.patch.b64 > /tmp/lookme-v1-complete.patch
          sed -e 's|/tmp/lookme_v09_base/|lookme/|g' -e 's|/mnt/data/lookme_v1_complete_work/|lookme/|g' /tmp/lookme-v1-complete.patch > /tmp/lookme-v1.patch
          patch -p0 < /tmp/lookme-v1.patch

          test -f lookme/src/services/faceIdentity.ts
          test -f lookme/src/services/garmentIdentity.ts
          grep -q 'Android V1 • 1.0' lookme/App.tsx
          grep -q 'Fashionpedia' lookme/src/services/localVision.ts
          grep -q 'react-native-mlkit-face-detection' lookme/package.json
          grep -q '"version": "1.0.0"' lookme/app.json

      - name: Install SDK-compatible dependencies
        working-directory: lookme
        run: |
          npm install
          npx expo install --fix

      - name: Fix ONNX Runtime for Expo 57 / Gradle 9
        working-directory: lookme
        run: |
          set -euo pipefail
          test -f node_modules/onnxruntime-react-native/android/build.gradle
          python - <<'PY'
          from pathlib import Path
          p=Path('node_modules/onnxruntime-react-native/android/build.gradle')
          s=p.read_text()
          old='if (VersionNumber.parse(REACT_NATIVE_VERSION) < VersionNumber.parse("0.71")) {'
          if old in s:
              s=s.replace(old, 'if (false) { // React Native 0.86 legacy branch disabled')
          p.write_text(s)
          PY
          rm -f node_modules/onnxruntime-react-native/unimodule.json

      - name: TypeScript check
        working-directory: lookme
        run: npx tsc --noEmit

      - name: Expo dependency check
        working-directory: lookme
        run: npx expo-doctor

      - name: Prebuild Android
        working-directory: lookme
        run: npx expo prebuild --platform android --clean

      - name: Verify native autolinking
        working-directory: lookme
        run: |
          set -euo pipefail
          npx expo-modules-autolinking react-native-config --platform android --json > /tmp/rnconfig.json
          grep -qi 'onnxruntime-react-native' /tmp/rnconfig.json
          grep -qi 'mlkit-face-detection' /tmp/rnconfig.json

      - name: Build standalone release APK
        working-directory: lookme/android
        run: ./gradlew assembleRelease

      - name: Build Play Store bundle preview
        working-directory: lookme/android
        run: ./gradlew bundleRelease

      - name: Verify release artifacts
        run: |
          set -euo pipefail
          APK=$(find lookme/android/app/build/outputs/apk/release -name '*.apk' | head -1)
          AAB=$(find lookme/android/app/build/outputs/bundle/release -name '*.aab' | head -1)
          test -n "$APK"
          test -n "$AAB"
          unzip -l "$APK" | grep -q 'assets/index.android.bundle'

      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: LookMe-Android-V1-Complete-Candidate
          path: |
            lookme/android/app/build/outputs/apk/release/*.apk
            lookme/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
