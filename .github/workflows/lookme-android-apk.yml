name: Build LookMe Android APK

on:
  push:
    branches: [lookme-android-v1]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Download LookMe source
        run: |
          rm -rf lookme
          mkdir -p lookme
          curl -fsSL 'https://lbmgmfpvxggxoboxfsib.supabase.co/functions/v1/lookme-build-source' -o /tmp/lookme.zip
          unzip -q /tmp/lookme.zip -d lookme

      - name: Patch Expo 57 compatibility and version
        working-directory: lookme
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('App.tsx')
          s=p.read_text()
          s=s.replace("import * as MediaLibrary from 'expo-media-library';", "import * as MediaLibrary from 'expo-media-library/legacy';")
          s=s.replace('Android V1 • 0.4', 'Android V1 • 0.5')
          p.write_text(s)
          p=Path('app.json')
          d=json.loads(p.read_text())
          d['expo']['version']='0.5.0'
          d['expo']['android']['versionCode']=5
          p.write_text(json.dumps(d, ensure_ascii=False, indent=2)+'\n')
          PY
          grep -q "expo-media-library/legacy" App.tsx

      - name: Install SDK-compatible dependencies
        working-directory: lookme
        run: |
          npm install
          npx expo install --fix

      - name: TypeScript check
        working-directory: lookme
        run: npx tsc --noEmit

      - name: Expo dependency check
        working-directory: lookme
        run: npx expo-doctor

      - name: Backend health and AI smoke tests
        if: contains(github.event.head_commit.message, '[ai-smoke]')
        run: |
          set -euo pipefail
          BASE='https://lbmgmfpvxggxoboxfsib.supabase.co/functions/v1'
          curl -fsSL "$BASE/lookme-health" -o /tmp/health.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/health.json'))
          assert d.get('ok') is True, d
          assert d.get('openaiConfigured') is True, d
          print('health ok')
          PY

          curl -fsSL --max-time 120 -X POST "$BASE/lookme-analyze-photo" \
            -H 'Content-Type: application/json' \
            -d '{"image_url":"https://placehold.co/512x768/png"}' \
            -o /tmp/analyze.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/analyze.json'))
          assert 'error' not in d, d
          assert isinstance(d.get('garments'), list), d
          print('analysis backend ok')
          PY

          curl -fsSL --max-time 120 -X POST "$BASE/lookme-suggest-looks" \
            -H 'Content-Type: application/json' \
            -d '{"occasion":"Date","garments":[{"id":"11111111-1111-1111-1111-111111111111","category":"top","subtype":"shirt","label":"white shirt","colors":["white"],"material":"cotton","pattern":"solid"},{"id":"22222222-2222-2222-2222-222222222222","category":"bottom","subtype":"trousers","label":"black trousers","colors":["black"],"material":"cotton","pattern":"solid"},{"id":"33333333-3333-3333-3333-333333333333","category":"shoes","subtype":"sneakers","label":"white sneakers","colors":["white"],"material":"leather","pattern":"solid"}]}' \
            -o /tmp/suggest.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/suggest.json'))
          assert 'error' not in d, d
          assert isinstance(d.get('looks'), list), d
          assert len(d['looks']) >= 1, d
          print('stylist backend ok')
          PY

          STATUS=$(curl -sS --max-time 240 -w '%{http_code}' -X POST "$BASE/lookme-generate-tryon" \
            -H 'Content-Type: application/json' \
            -d '{"person_url":"https://placehold.co/512x768/png","garment_urls":["https://placehold.co/512x512/png"],"occasion":"everyday"}' \
            -o /tmp/tryon.json)
          python - "$STATUS" <<'PY'
          import json,sys
          status=int(sys.argv[1])
          d=json.load(open('/tmp/tryon.json'))
          if status >= 400 or 'error' in d:
              print('try-on error:', d.get('error', d))
              raise SystemExit(1)
          b=d.get('image_base64','')
          assert len(b) > 1000, len(b)
          print('try-on backend ok')
          PY

      - name: Prebuild Android
        working-directory: lookme
        run: npx expo prebuild --platform android --clean

      - name: Build standalone release APK
        working-directory: lookme/android
        run: ./gradlew assembleRelease

      - name: Verify APK contains JS bundle
        run: |
          APK=$(find lookme/android/app/build/outputs/apk/release -name '*.apk' | head -1)
          test -n "$APK"
          unzip -l "$APK" | grep -q 'assets/index.android.bundle'
          echo "Verified standalone JS bundle in $APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LookMe-Android-V0.5-APK
          path: lookme/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
