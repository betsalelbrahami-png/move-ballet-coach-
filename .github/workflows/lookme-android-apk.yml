name: Build LookMe Complete Android APK

on:
  push:
    branches: [lookme-v1-complete]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore complete LookMe V1 source
        run: |
          set -euo pipefail
          rm -rf lookme /tmp/lookme-v1-source.zip /tmp/lookme-v1-source.b64
          mkdir -p lookme
          cat lookme-v1-source.b64.part00 lookme-v1-source.b64.part01 lookme-v1-source.b64.part02 lookme-v1-source.b64.part03 lookme-v1-source.b64.part04 lookme-v1-source.b64.part05 > /tmp/lookme-v1-source.b64
          test "$(wc -c < /tmp/lookme-v1-source.b64)" -eq 33884
          base64 -d /tmp/lookme-v1-source.b64 > /tmp/lookme-v1-source.zip
          echo '7ac4ff0dd316cf6952ca152315596b6e0a2da02284397f4aceb2c29383bf1179  /tmp/lookme-v1-source.zip' | sha256sum -c -
          unzip -t /tmp/lookme-v1-source.zip
          unzip -q /tmp/lookme-v1-source.zip -d lookme
          test -f lookme/App.tsx
          test -f lookme/src/services/faceIdentity.ts
          test -f lookme/src/services/garmentIdentity.ts
          grep -q 'Android V1 • 1.0' lookme/App.tsx
          grep -q 'Fashionpedia' lookme/src/services/localVision.ts
          grep -q '@infinitered/react-native-mlkit-face-detection' lookme/package.json
          grep -q '"version": "1.0.0"' lookme/app.json

      - name: Install SDK-compatible dependencies
        working-directory: lookme
        run: |
          npm install
          npx expo install --fix

      - name: Fix ONNX Runtime for Expo 57 / Gradle 9
        working-directory: lookme
        run: |
          set -euo pipefail
          test -f node_modules/onnxruntime-react-native/android/build.gradle
          python - <<'PY'
          from pathlib import Path
          p=Path('node_modules/onnxruntime-react-native/android/build.gradle')
          s=p.read_text()
          old='if (VersionNumber.parse(REACT_NATIVE_VERSION) < VersionNumber.parse("0.71")) {'
          if old in s:
              s=s.replace(old, 'if (false) { // React Native 0.86: legacy pre-0.71 dependency branch disabled')
          p.write_text(s)
          PY
          rm -f node_modules/onnxruntime-react-native/unimodule.json
          ! grep -q 'VersionNumber.parse(REACT_NATIVE_VERSION)' node_modules/onnxruntime-react-native/android/build.gradle

      - name: TypeScript check
        working-directory: lookme
        run: npx tsc --noEmit

      - name: Expo dependency check
        working-directory: lookme
        run: npx expo-doctor

      - name: Prebuild Android
        working-directory: lookme
        run: npx expo prebuild --platform android --clean

      - name: Verify native dependencies
        working-directory: lookme
        run: |
          set -euo pipefail
          test -d node_modules/@infinitered/react-native-mlkit-face-detection/android
          npx expo-modules-autolinking react-native-config --platform android --json > /tmp/rnconfig.json
          grep -qi 'onnxruntime-react-native' /tmp/rnconfig.json
          echo 'ML Kit Android module present; Gradle build will validate React Native autolinking.'

      - name: Build standalone release APK
        working-directory: lookme/android
        run: ./gradlew assembleRelease

      - name: Build Play Store bundle preview
        working-directory: lookme/android
        run: ./gradlew bundleRelease

      - name: Verify release artifacts
        run: |
          set -euo pipefail
          APK=$(find lookme/android/app/build/outputs/apk/release -name '*.apk' | head -1)
          AAB=$(find lookme/android/app/build/outputs/bundle/release -name '*.aab' | head -1)
          test -n "$APK"
          test -n "$AAB"
          unzip -l "$APK" | grep -q 'assets/index.android.bundle'
          echo "Verified standalone JS bundle in $APK"
          echo "Verified Play bundle at $AAB"

      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: LookMe-Android-V1.0-Complete
          path: |
            lookme/android/app/build/outputs/apk/release/*.apk
            lookme/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
