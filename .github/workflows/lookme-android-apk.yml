name: Build LookMe Android APK

on:
  push:
    branches: [lookme-android-v1]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore LookMe v0.6 source
        run: |
          set -euo pipefail
          cat .github/lookme-v06-source.part00 \
              .github/lookme-v06-source.part01 \
              .github/lookme-v06-source.part02 \
              .github/lookme-v06-source.part03 \
              .github/lookme-v06-source.part04 > /tmp/lookme.b64
          test "$(wc -c < /tmp/lookme.b64)" -eq 24640
          base64 -d /tmp/lookme.b64 > /tmp/lookme.zip
          rm -rf lookme
          mkdir -p lookme
          unzip -q /tmp/lookme.zip -d lookme
          test -f lookme/App.tsx
          test -f lookme/src/services/localFashion.ts
          test -f lookme/src/services/localStylist.ts

      - name: Bundle local Fashionpedia detector
        run: |
          set -euo pipefail
          mkdir -p lookme/assets
          curl -L --fail 'https://huggingface.co/louisJLN/yolo8-fashionpedia/resolve/main/results/yolov8n-fashionpedia-1.onnx?download=true' -o lookme/assets/fashionpedia.onnx
          echo '6b581af3abe2b4ae97a84cbe9aef5ae37207a68ee966d22b0b8d7969d79e6920  lookme/assets/fashionpedia.onnx' | sha256sum -c -
          ls -lh lookme/assets/fashionpedia.onnx

      - name: Install SDK-compatible dependencies
        working-directory: lookme
        run: |
          npm install
          npx expo install --fix

      - name: TypeScript check
        working-directory: lookme
        run: npx tsc --noEmit

      - name: Expo dependency check
        working-directory: lookme
        run: npx expo-doctor

      - name: Prebuild Android
        working-directory: lookme
        run: npx expo prebuild --platform android --clean

      - name: Build standalone release APK
        working-directory: lookme/android
        run: ./gradlew assembleRelease

      - name: Verify standalone APK
        run: |
          set -euo pipefail
          APK=$(find lookme/android/app/build/outputs/apk/release -name '*.apk' | head -1)
          test -n "$APK"
          unzip -l "$APK" | grep -q 'assets/index.android.bundle'
          unzip -l "$APK" | grep -q 'fashionpedia.onnx'
          echo "Verified JS bundle and local fashion model in $APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LookMe-Android-V0.6-APK
          path: lookme/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
