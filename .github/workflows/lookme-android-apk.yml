name: Build LookMe Android APK

on:
  push:
    branches: [lookme-android-v1]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download LookMe source
        run: |
          rm -rf lookme
          mkdir -p lookme
          curl -fsSL 'https://lbmgmfpvxggxoboxfsib.supabase.co/functions/v1/lookme-build-source' -o /tmp/lookme.zip
          unzip -q /tmp/lookme.zip -d lookme

      - name: Install dependencies
        working-directory: lookme
        run: |
          npm install
          npx expo install --fix

      - name: Prebuild Android
        working-directory: lookme
        run: npx expo prebuild --platform android --clean

      - name: Build standalone release APK
        working-directory: lookme/android
        run: ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LookMe-Android-Release-APK
          path: lookme/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
