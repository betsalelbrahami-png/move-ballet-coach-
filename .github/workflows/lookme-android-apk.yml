name: Build LookMe Android APK

on:
  push:
    branches: [lookme-android-v1]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download LookMe source
        run: |
          rm -rf lookme
          mkdir -p lookme
          curl -fsSL 'https://lbmgmfpvxggxoboxfsib.supabase.co/functions/v1/lookme-build-source' -o /tmp/lookme.zip
          unzip -q /tmp/lookme.zip -d lookme

      - name: Install dependencies
        working-directory: lookme
        run: |
          npm install
          npx expo install --fix
          npm install --save-dev @react-native-community/cli

      - name: Prebuild Android
        working-directory: lookme
        run: npx expo prebuild --platform android --clean

      - name: Bundle JavaScript into APK
        working-directory: lookme
        run: |
          mkdir -p android/app/src/main/assets
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file node_modules/expo/AppEntry.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res

      - name: Build standalone debug APK
        working-directory: lookme/android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LookMe-Android-Standalone-APK
          path: lookme/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
