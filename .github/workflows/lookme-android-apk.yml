name: Build LookMe Android APK

on:
  push:
    branches: [lookme-android-v1]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore LookMe v0.7 source
        run: |
          set -euo pipefail
          rm -rf lookme
          mkdir -p lookme
          curl -fsSL 'https://lbmgmfpvxggxoboxfsib.supabase.co/functions/v1/lookme-build-source' -o /tmp/lookme.zip
          unzip -t /tmp/lookme.zip
          unzip -q /tmp/lookme.zip -d lookme
          sed -e 's|/tmp/v06orig/|lookme/|g' -e 's|/tmp/v07/|lookme/|g' lookme-v07.patch > /tmp/lookme-v07.patch
          patch -p0 < /tmp/lookme-v07.patch
          test -f lookme/App.tsx
          test -f lookme/src/services/localVision.ts
          test -f lookme/src/services/localStylist.ts
          grep -q 'Android V1 • 0.7' lookme/App.tsx
          grep -q 'lookme-fashion-v2.onnx' lookme/src/services/localVision.ts

      - name: Install SDK-compatible dependencies
        working-directory: lookme
        run: |
          npm install
          npx expo install --fix

      - name: Fix ONNX Runtime for Expo 57 / Gradle 9
        working-directory: lookme
        run: |
          set -euo pipefail
          test -f node_modules/onnxruntime-react-native/android/build.gradle
          python - <<'PY'
          from pathlib import Path
          p=Path('node_modules/onnxruntime-react-native/android/build.gradle')
          s=p.read_text()
          old='if (VersionNumber.parse(REACT_NATIVE_VERSION) < VersionNumber.parse("0.71")) {'
          if old in s:
              s=s.replace(old, 'if (false) { // React Native 0.86: legacy pre-0.71 dependency branch disabled')
          p.write_text(s)
          PY
          rm -f node_modules/onnxruntime-react-native/unimodule.json
          ! grep -q 'VersionNumber.parse(REACT_NATIVE_VERSION)' node_modules/onnxruntime-react-native/android/build.gradle

      - name: TypeScript check
        working-directory: lookme
        run: npx tsc --noEmit

      - name: Expo dependency check
        working-directory: lookme
        run: npx expo-doctor

      - name: Prebuild Android
        working-directory: lookme
        run: npx expo prebuild --platform android --clean

      - name: Verify ONNX native autolinking
        working-directory: lookme
        run: |
          set -euo pipefail
          npx expo-modules-autolinking react-native-config --platform android --json > /tmp/rnconfig.json
          grep -qi 'onnxruntime-react-native' /tmp/rnconfig.json

      - name: Build standalone release APK
        working-directory: lookme/android
        run: ./gradlew assembleRelease

      - name: Build Play Store bundle preview
        working-directory: lookme/android
        run: ./gradlew bundleRelease

      - name: Verify release artifacts
        run: |
          set -euo pipefail
          APK=$(find lookme/android/app/build/outputs/apk/release -name '*.apk' | head -1)
          AAB=$(find lookme/android/app/build/outputs/bundle/release -name '*.aab' | head -1)
          test -n "$APK"
          test -n "$AAB"
          unzip -l "$APK" | grep -q 'assets/index.android.bundle'
          echo "Verified standalone JS bundle in $APK"
          echo "Verified Play bundle at $AAB"

      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: LookMe-Android-V0.7-Release
          path: |
            lookme/android/app/build/outputs/apk/release/*.apk
            lookme/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
