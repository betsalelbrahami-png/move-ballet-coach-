name: Verify Voix douce
on:
  push:
    branches: [main]
    paths:
      - 'voix-douce/**'
      - '.github/workflows/verify-voix-douce.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser and audio test dependencies
        run: |
          npm install --no-save playwright@1.51.1
          npx playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak ffmpeg
      - name: Verify UI, audio capture, subtraction and real iter_model call
        run: node voix-douce/test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voix-douce-verification
          path: |
            /tmp/voix-douce-report.json
            /tmp/voix-douce-test.png
