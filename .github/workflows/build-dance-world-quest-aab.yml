name: Build Dance World Quest AAB

on:
  workflow_dispatch:
  push:
    paths:
      - "MoveQuest-Android-NativeShare-v0.3.zip"
      - ".github/workflows/build-dance-world-quest-aab.yml"

jobs:
  build-aab:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify exact v1.3.3 source
        run: |
          echo "b090c4d6c9ecddc96e3d8febb3c256ec702a50f3645bae9ba9b090d0c15dbeb2  MoveQuest-Android-NativeShare-v0.3.zip" | sha256sum -c -

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 9.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.1.0"

      - name: Unpack Android app
        run: |
          rm -rf build
          unzip -q MoveQuest-Android-NativeShare-v0.3.zip -d build

      - name: Verify Play version
        run: |
          grep -q 'versionCode 16' build/MoveQuest-Android-v0.3/app/build.gradle
          grep -q 'versionName "1.3.3"' build/MoveQuest-Android-v0.3/app/build.gradle
          grep -q 'targetSdk 36' build/MoveQuest-Android-v0.3/app/build.gradle

      - name: Build release AAB
        working-directory: build/MoveQuest-Android-v0.3
        run: gradle :app:bundleRelease

      - name: Upload unsigned AAB
        uses: actions/upload-artifact@v4
        with:
          name: DanceWorldQuest-v1.3.3-AAB-UNSIGNED
          path: build/MoveQuest-Android-v0.3/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
