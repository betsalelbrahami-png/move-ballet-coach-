<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MOVE Ballet Coach</title>
<style>
body{margin:0;background:#0b0d12;color:white;font-family:system-ui}.app{max-width:760px;margin:auto;padding:14px}
button{border:0;border-radius:14px;padding:12px 14px;font-weight:800}.primary{background:white;color:#111}.dark{background:#262c3a;color:white}
.row{display:flex;gap:8px;flex-wrap:wrap}.stage{position:relative;aspect-ratio:3/4;background:#171a22;border-radius:22px;overflow:hidden;margin-top:12px}
video,canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.ref{position:absolute;right:12px;top:70px;width:42%;background:#080a0d;border-radius:16px;overflow:hidden;border:1px solid #ffffff33}
.ref svg{width:100%;display:block;background:#111827}.label{text-align:center;padding:7px;font-weight:800;font-size:12px}
.hud{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between}.pill{background:#000c;padding:9px 12px;border-radius:999px;font-weight:800}
.fb{position:absolute;left:12px;right:12px;bottom:14px;background:#000d;border-radius:16px;padding:12px;text-align:center}
#barwrap{height:7px;background:#ffffff22;border-radius:999px;margin-top:8px;overflow:hidden}#bar{height:100%;width:0;background:white}
.lib{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-top:12px}.item{background:#171b26;padding:9px;border-radius:12px;font-size:13px}
@media(min-width:700px){.lib{grid-template-columns:repeat(4,1fr)}}
</style></head><body><div class="app">
<h1>MOVE · Ballet Coach</h1><div class="row">
<button id="tech" class="primary">Mode technique</button><button id="course" class="dark">Cours 5 min</button><button id="voice" class="dark">🔊 Voix ON</button>
</div>
<div class="stage"><video id="v" playsinline autoplay muted></video><canvas id="c"></canvas>
<div class="hud"><div class="pill">Score <span id="score">—</span></div><div class="pill" id="timer">00:00</div></div>
<div class="ref"><svg id="ref" viewBox="0 0 240 320"></svg><div id="rlabel" class="label"></div></div>
<div class="fb"><b id="title">Active la caméra</b><div id="corr">Place tout ton corps dans le cadre.</div><div id="barwrap"><div id="bar"></div></div><small id="hold">75% pendant 5 secondes pour valider</small></div>
</div>
<div class="row" style="margin-top:10px"><button id="cam" class="primary">📷 Activer caméra</button><button id="next" class="dark">Position suivante →</button></div>
<div id="lib" class="lib"></div></div>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>
<script>
const P=[{"category": "Positions", "name": "Première position", "id": "first"}, {"category": "Positions", "name": "Deuxième position", "id": "second"}, {"category": "Positions", "name": "Troisième position", "id": "third"}, {"category": "Positions", "name": "Quatrième position", "id": "fourth"}, {"category": "Positions", "name": "Cinquième position", "id": "fifth"}, {"category": "Bras", "name": "Bras bas", "id": "bras_bas"}, {"category": "Bras", "name": "Première des bras", "id": "arms_first"}, {"category": "Bras", "name": "Deuxième des bras", "id": "arms_second"}, {"category": "Bras", "name": "Troisième des bras", "id": "arms_third"}, {"category": "Bras", "name": "Quatrième des bras", "id": "arms_fourth"}, {"category": "Bras", "name": "Cinquième des bras", "id": "arms_fifth"}, {"category": "Barre", "name": "Demi-plié", "id": "demi_plie"}, {"category": "Barre", "name": "Grand plié", "id": "grand_plie"}, {"category": "Barre", "name": "Relevé", "id": "releve"}, {"category": "Barre", "name": "Tendu devant", "id": "tendu_front"}, {"category": "Barre", "name": "Tendu à la seconde", "id": "tendu_side"}, {"category": "Barre", "name": "Tendu derrière", "id": "tendu_back"}, {"category": "Barre", "name": "Dégagé", "id": "degage"}, {"category": "Barre", "name": "Fondu", "id": "fondu"}, {"category": "Barre", "name": "Rond de jambe à terre", "id": "rond"}, {"category": "Centre", "name": "Retiré / Passé", "id": "passe"}, {"category": "Centre", "name": "Sous-sus", "id": "soussous"}, {"category": "Centre", "name": "Échappé", "id": "echappe"}, {"category": "Adagio", "name": "Arabesque 1", "id": "arabesque1"}, {"category": "Adagio", "name": "Arabesque 2", "id": "arabesque2"}, {"category": "Adagio", "name": "Arabesque 3", "id": "arabesque3"}, {"category": "Adagio", "name": "Arabesque 4", "id": "arabesque4"}, {"category": "Adagio", "name": "Attitude devant", "id": "attitude_front"}, {"category": "Adagio", "name": "Attitude derrière", "id": "attitude_back"}, {"category": "Adagio", "name": "Développé devant", "id": "developpe_front"}, {"category": "Adagio", "name": "Développé à la seconde", "id": "developpe_side"}, {"category": "Adagio", "name": "Développé derrière", "id": "developpe_back"}, {"category": "Grand battement", "name": "Grand battement devant", "id": "gb_front"}, {"category": "Grand battement", "name": "Grand battement à la seconde", "id": "gb_side"}, {"category": "Grand battement", "name": "Grand battement derrière", "id": "gb_back"}, {"category": "Port de bras", "name": "Cambré", "id": "cambre"}, {"category": "Port de bras", "name": "Port de bras", "id": "port"}, {"category": "Allegro", "name": "Assemblé", "id": "assemble"}, {"category": "Allegro", "name": "Jeté", "id": "jete"}, {"category": "Allegro", "name": "Glissade", "id": "glissade"}, {"category": "Allegro", "name": "Sissonne", "id": "sissonne"}, {"category": "Allegro", "name": "Changement", "id": "changement"}, {"category": "Allegro", "name": "Entrechat quatre", "id": "entrechat4"}],Q=x=>document.getElementById(x);let idx=0,voice=true,mode='tech',busy=false,run=false,holdStart=0,courseStart=0,courseStep=0,lastSpeak=0;
const courseIds=['first','demi_plie','releve','arms_second','tendu_side','passe','arabesque1','developpe_side','soussous','echappe'];
function cur(){return P[idx]} function speak(t){if(!voice||!speechSynthesis)return;let n=Date.now();if(n-lastSpeak<2500)return;lastSpeak=n;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';speechSynthesis.speak(u)}
function setPos(i){idx=(i+P.length)%P.length;holdStart=0;Q('bar').style.width='0';Q('title').textContent=cur().name;Q('rlabel').textContent='PROF · '+cur().name;drawRef(cur().id)}
function drawRef(id){let arm='side',leg='normal';if(id.includes('fifth')||id==='arms_fifth')arm='up';if(id.includes('first')||id==='arms_first')arm='round';if(id.includes('arabesque')||id.includes('back'))leg='back';if(id.includes('side')||id==='passe')leg='side';if(id.includes('plie'))leg='plie';
let arms=arm==='up'?'<line x1="95" y1="85" x2="105" y2="25"/><line x1="145" y1="85" x2="135" y2="25"/>':arm==='round'?'<path d="M95 85 Q120 130 145 85"/>':'<line x1="95" y1="85" x2="25" y2="95"/><line x1="145" y1="85" x2="215" y2="95"/>';
let legs=leg==='back'?'<line x1="105" y1="165" x2="100" y2="290"/><line x1="135" y1="165" x2="210" y2="155"/>':leg==='side'?'<line x1="105" y1="165" x2="95" y2="290"/><line x1="135" y1="165" x2="215" y2="210"/>':leg==='plie'?'<line x1="105" y1="165" x2="75" y2="230"/><line x1="75" y1="230" x2="55" y2="290"/><line x1="135" y1="165" x2="165" y2="230"/><line x1="165" y1="230" x2="185" y2="290"/>':'<line x1="105" y1="165" x2="95" y2="290"/><line x1="135" y1="165" x2="145" y2="290"/>';
Q('ref').innerHTML='<circle cx="120" cy="42" r="20" fill="#e7b28f"/><path d="M95 72 Q120 62 145 72 L140 165 L100 165Z" fill="#eee"/><g stroke="#eee" stroke-width="14" stroke-linecap="round">'+arms+legs+'</g>'}
function score(lm,id){let s=100,msg='Très bien. Garde la ligne et respire.';let LS=lm[11],RS=lm[12],LH=lm[23],RH=lm[24],LA=lm[27],RA=lm[28],LW=lm[15],RW=lm[16];
if(Math.abs(LS.y-RS.y)>.06){s-=15;msg='Remets les épaules sur la même ligne.'} if(Math.abs(LH.y-RH.y)>.06){s-=15;msg='Stabilise le bassin.'}
if(id.includes('second')&&Math.abs(LA.x-RA.x)<.18){s-=22;msg='Écarte davantage les pieds.'}
if((id.includes('arabesque')||id.includes('back'))&&Math.abs(LA.y-RA.y)<.15){s-=28;msg='Monte davantage la jambe arrière.'}
if(id==='arms_second'&&(Math.abs(LW.y-LS.y)>.14||Math.abs(RW.y-RS.y)>.14)){s-=22;msg='Place les bras plus près de la hauteur des épaules.'}
return [Math.max(0,Math.round(s)),msg]}
function onRes(r){let c=Q('c'),x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);if(!r.poseLandmarks){Q('score').textContent='—';return}
drawConnectors(x,r.poseLandmarks,POSE_CONNECTIONS,{color:'#55ff78',lineWidth:3});drawLandmarks(x,r.poseLandmarks,{color:'#fff',radius:2});
let [s,m]=score(r.poseLandmarks,cur().id);Q('score').textContent=s+'%';Q('corr').textContent=m;if(s>=75){if(!holdStart)holdStart=Date.now();let d=(Date.now()-holdStart)/5000;Q('bar').style.width=Math.min(100,d*100)+'%';Q('hold').textContent='Tiens encore '+Math.max(0,Math.ceil(5-(Date.now()-holdStart)/1000))+' s';if(d>=1){speak('Bravo. Position suivante.');Q('hold').textContent='Bravo ✓';holdStart=0;setTimeout(()=>mode==='course'?advanceCourse():setPos(idx+1),700)}}else{holdStart=0;Q('bar').style.width='0';Q('hold').textContent='75% pendant 5 secondes pour valider';if(s<70)speak(m)}}
const pose=new Pose({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/pose/${f}`});pose.setOptions({modelComplexity:0,smoothLandmarks:true,minDetectionConfidence:.5,minTrackingConfidence:.5});pose.onResults(onRes);
async function loop(){if(!run)return;let v=Q('v');if(v.readyState>=2&&!busy){busy=true;let c=Q('c');c.width=v.videoWidth||720;c.height=v.videoHeight||1280;try{await pose.send({image:v})}catch(e){}busy=false}requestAnimationFrame(loop)}
Q('cam').onclick=async()=>{try{let st=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});Q('v').srcObject=st;await Q('v').play();run=true;Q('cam').textContent='Caméra ✓';loop()}catch(e){Q('corr').textContent='Erreur caméra : '+e.message}};
Q('voice').onclick=()=>{voice=!voice;Q('voice').textContent=voice?'🔊 Voix ON':'🔇 Voix OFF'};Q('next').onclick=()=>mode==='course'?advanceCourse():setPos(idx+1);
Q('tech').onclick=()=>{mode='tech';Q('tech').className='primary';Q('course').className='dark'};Q('course').onclick=()=>{mode='course';courseStart=Date.now();courseStep=0;Q('course').className='primary';Q('tech').className='dark';advanceCourse();timer()};
function advanceCourse(){let id=courseIds[courseStep%courseIds.length];let i=P.findIndex(x=>x.id===id);if(i>=0)setPos(i);courseStep++;speak('Maintenant '+cur().name)}
function timer(){if(mode!=='course')return;let e=Math.floor((Date.now()-courseStart)/1000);Q('timer').textContent=String(Math.floor(e/60)).padStart(2,'0')+':'+String(e%60).padStart(2,'0');if(e>=300){mode='tech';Q('title').textContent='Cours terminé';speak('Bravo. Le cours est terminé.');return}requestAnimationFrame(timer)}
P.forEach((p,i)=>{let d=document.createElement('div');d.className='item';d.innerHTML='<b>'+p.name+'</b><small>'+p.category+'</small>';d.onclick=()=>setPos(i);Q('lib').appendChild(d)});setPos(0);
</script></body></html>
